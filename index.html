<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unlike Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=DynaPuff:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Michroma&family=Orbitron:wght@500;600;700&family=Pirata+One&family=Racing+Sans+One&family=Saira+Stencil+One&family=Share+Tech+Mono&family=Special+Elite&family=Teko:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#10140f; --surface:#1a2018; --surface-2:#252d22; --line:#475141;
  --ink:#f2f5eb; --muted:#c4cbbd; --dim:#a8b29f; --accent:#f15c3f; --acid:#d4f06a;
  --f-display:'Saira Stencil One','Arial Narrow',sans-serif; --f-ui:'Chakra Petch',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
.ambience{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background-color:var(--paper);
  background-image:linear-gradient(135deg,rgba(212,240,106,.035),transparent 38%,rgba(241,92,63,.018)),repeating-linear-gradient(0deg,transparent 0 55px,rgba(222,238,203,.022) 56px),repeating-linear-gradient(90deg,transparent 0 55px,rgba(222,238,203,.022) 56px)}
.ambience::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(212,240,106,.18) .55px,transparent .7px);background-size:9px 9px;opacity:.1;mask-image:linear-gradient(180deg,#000 0%,transparent 76%)}
.shape{position:absolute;display:block;opacity:.58}
.shape-purple{top:-108px;left:-88px;width:230px;height:230px;border-radius:50%;background:#5147d3;opacity:.36}
.shape-teal{top:-62px;right:-112px;width:190px;height:180px;background:#27c7ad;clip-path:polygon(38% 0,100% 0,100% 100%,66% 60%,43% 88%,52% 40%,0 55%)}
.shape-bolt{top:31%;left:-66px;width:96px;height:160px;background:#ffc22e;clip-path:polygon(47% 0,100% 0,61% 42%,100% 42%,0 100%,27% 56%,0 56%)}
.shape-star{top:38px;left:35%;width:34px;height:34px;background:#ffbf32;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.shape-dot{width:16px;height:16px;border-radius:50%;background:#3282ff}
.shape-dot-a{top:34%;left:10%}.shape-dot-b{top:5%;right:34%;width:12px;height:12px;background:#21c7ad}.shape-dot-c{bottom:8%;left:36%;width:13px;height:13px;background:#21c7ad}
.shape-cross{width:34px;height:34px;color:#ec3d69}
.shape-cross::before,.shape-cross::after{content:"";position:absolute;left:50%;top:50%;background:currentColor;transform:translate(-50%,-50%) rotate(42deg)}
.shape-cross::before{width:34px;height:7px}.shape-cross::after{width:7px;height:34px}
.shape-cross-a{top:12%;left:20%}.shape-cross-b{right:-12px;top:63%}.shape-cross-c{left:9%;bottom:24%;color:#5269d8;transform:scale(.78)}
.shape-ring{left:-82px;bottom:-84px;width:220px;height:220px;border:28px solid #e83d68;border-radius:50%;box-shadow:0 0 0 44px rgba(35,57,114,.38)}
.shape-blue{right:-82px;bottom:-90px;width:210px;height:210px;border-radius:50%;background:#3159df;opacity:.78}
.shape-triangle{right:10%;bottom:18%;width:44px;height:40px;background:#ffc22e;clip-path:polygon(100% 0,100% 100%,0 50%)}
.shape-triangle-teal{left:13%;bottom:14%;width:40px;height:38px;background:#21c7ad;clip-path:polygon(0 0,100% 28%,18% 100%)}
.shape-squiggle{width:155px;height:58px;border:5px solid transparent;border-top-color:#4565d0;border-radius:50%;transform:rotate(-22deg)}
.shape-squiggle::after{content:"";position:absolute;left:44px;top:-5px;width:100px;height:53px;border:5px solid transparent;border-bottom-color:#4565d0;border-radius:50%;transform:rotate(-18deg)}
.shape-squiggle-a{left:-108px;top:19%}.shape-squiggle-b{right:-104px;top:29%;transform:rotate(155deg)}.shape-squiggle-c{right:12%;bottom:5%;transform:rotate(-35deg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 44px 72px}
.masthead{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;color:var(--ink);text-decoration:none}
.brand-monogram{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;gap:1px;border:1px solid #78835d;background:rgba(16,20,15,.82);color:var(--ink);font:400 10px/1 'Michroma',sans-serif}
.brand-monogram span:nth-child(2){color:var(--accent);font-size:13px}
.brand-mark{font:400 20px/1 'Michroma',var(--f-ui);letter-spacing:0;white-space:nowrap}
.brand-mark .slash{color:var(--acid);padding:0 3px}
.brand-kicker{border-left:1px solid var(--line);padding-left:15px;color:var(--muted);font:600 10px/1.45 var(--f-mono);letter-spacing:0;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:22px}
.player-field{display:flex;align-items:center;gap:10px;color:var(--muted);font:600 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.player-field input{width:140px;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:500 15px var(--f-ui);letter-spacing:0;text-transform:none}
.connection{position:relative;color:var(--muted);font:600 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.connection summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:42px}
.connection summary::-webkit-details-marker{display:none}
.connection summary::after{content:"";width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.connection[open] summary::after{transform:rotate(225deg) translate(-2px,-1px)}
.connection-panel{position:absolute;z-index:10;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));padding:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.42);text-transform:none;letter-spacing:0}
.connection-panel label{display:grid;gap:7px;color:var(--muted);font:600 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.connection-panel input{width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;background:#11160f;color:var(--ink);font:14px var(--f-mono);letter-spacing:0;text-transform:none}
.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:43px 0 27px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--muted);font:600 11px/1 var(--f-mono);letter-spacing:0;text-transform:uppercase}
.intro .eyebrow{display:block;margin-bottom:8px}
.intro h1{margin:0;color:#ffd166;font:400 52px/1.1 'Bungee',var(--f-display);letter-spacing:0;text-shadow:2px 3px 0 #68437d;text-transform:uppercase}
.intro h1 em{color:#5ce4cf;font-style:normal;font-weight:400;text-shadow:2px 3px 0 #294c91}
.collection-count{display:flex;align-items:baseline;gap:10px;padding-bottom:5px;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase;white-space:nowrap}
.collection-count strong{color:var(--acid);font:400 28px/1 var(--f-display);letter-spacing:0}
.library{padding-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{margin:0;color:var(--ink);font:700 17px/1.2 var(--f-ui);letter-spacing:0;text-transform:uppercase}
.section-index{color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.card{min-width:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:rgba(26,32,24,.97);transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#85916d;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.thumb-wrap{position:relative;overflow:hidden;background:var(--surface-2);aspect-ratio:1.68}
.thumb{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover .thumb{transform:scale(1.025)}
.status{position:absolute;top:12px;left:12px;padding:6px 9px;background:#11160f;color:var(--acid);border:1px solid rgba(212,240,106,.5);font:500 10px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.card-body{display:flex;flex-direction:column;align-items:flex-start;padding:20px 21px 18px;min-height:236px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:11px;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.card-meta .players{color:var(--ink)}
.game-title{margin:0 0 8px;color:var(--ink);font:400 32px/1.05 var(--f-display);letter-spacing:0;text-transform:uppercase}
.game-title-mafia{font-family:'Special Elite',serif;font-size:29px;color:#ff7772;text-transform:none}
.game-title-party-pack{font-family:'DynaPuff',var(--f-display);font-size:31px;font-weight:700}
.party-word{display:inline-block;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 #fff1a6) drop-shadow(3px 3px 0 #a84772) drop-shadow(5px 5px 0 #382050)}
.party-word-a{background-image:linear-gradient(110deg,#ff5578 0%,#ff9d44 54%,#ffe05c 100%)}
.party-word-b{margin-left:.2em;background-image:linear-gradient(110deg,#ffe05c 0%,#50d8c2 53%,#738cff 100%)}
.game-title-putt-club{font-family:'Racing Sans One',var(--f-display);font-size:35px;color:#a2e86f}
.game-title-riftbreak{font-family:'Orbitron',var(--f-display);font-size:25px;font-weight:700;color:#c7a2ff}
.game-title-sea-of-chaos{font-family:'Pirata One',var(--f-display);font-size:30px;color:#6fddd5;text-transform:none}
.game-title-short-fuse{display:inline-flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:31px;line-height:1;text-transform:uppercase}
.game-title-short-fuse .fuse-short{font-family:'Black Ops One','Saira Stencil One',var(--f-display);font-size:31px;font-weight:400;color:#ff3326;letter-spacing:.04em;text-shadow:0 0 18px rgba(255,51,38,.5),2px 2px 0 #280805,3px 3px 6px rgba(0,0,0,.75)}
.game-title-short-fuse .fuse-fuse{font-family:'Share Tech Mono',var(--f-mono);font-size:29px;font-weight:700;color:#ffffff;letter-spacing:.14em;text-shadow:0 0 10px rgba(255,255,255,.6),0 0 20px rgba(255,60,45,.3),2px 2px 0 #0d1215,3px 3px 6px rgba(0,0,0,.75)}
.tagline{display:-webkit-box;overflow:hidden;margin:0;color:#d8dfd1;font-size:15px;line-height:1.5;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tag{color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.tag+.tag::before{content:"/";margin-right:9px;color:#87927e}
.card-action{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:auto;padding-top:16px}
.role-select-wrap{display:grid;gap:3px;min-width:0}
.role-select-wrap label{color:var(--muted);font:500 10px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.role-select{max-width:180px;padding:3px 18px 3px 0;border:0;background:transparent;color:var(--ink);font:600 15px var(--f-ui);cursor:pointer}
.single-role{color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:44px;padding:0 18px;border:1px solid var(--acid);border-radius:3px;background:var(--acid);color:#171b12;font:700 14px var(--f-ui);letter-spacing:0;text-decoration:none;transition:background .18s,color .18s,border-color .18s}
.btn:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.btn.primary{background:var(--acid);color:#171b12}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{transform:translateY(1px)}
.add-game{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:14px}
.add-game summary{width:max-content;cursor:pointer;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:0;text-transform:uppercase}
.add-game p{max-width:76ch;margin:10px 0 0;line-height:1.7}
code{padding:2px 5px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);font:12px var(--f-mono)}
.empty{margin:0;color:var(--muted);font-size:13px}
/* full-window player */
.player{position:fixed;inset:0;z-index:20;background:#000;display:grid;grid-template-rows:auto 1fr}
.pbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:#111;border-bottom:1px solid #333;flex-wrap:wrap}
.pbar b{font:500 22px/1 var(--f-display);color:#f4f4ef}
.pbar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.player .btn{border-color:#41443f;background:#1b1e1a;color:#f4f4ef}
.player .btn:hover{border-color:#b64232;background:#b64232}
.share{font:12px var(--f-mono);color:#a9afa6;max-width:min(520px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{width:100%;height:100%;border:0;background:#050607}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:10px 16px;font:500 11px var(--f-mono)}
@media(max-width:1000px){.wrap{padding-inline:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro h1{font-size:46px}}
@media(max-width:640px){.shape-purple{top:-54px;left:-62px;width:122px;height:122px}.shape-teal{top:-42px;right:-64px;width:108px;height:105px}.shape-bolt{top:36%;left:-38px;width:52px;height:92px}.shape-star{top:24px;left:78%;width:20px;height:20px}.shape-dot{width:10px;height:10px}.shape-dot-a{top:31%;left:6%}.shape-dot-b{top:3%;right:8%;width:8px;height:8px}.shape-dot-c{bottom:4%;left:35%;width:8px;height:8px}.shape-cross{width:23px;height:23px}.shape-cross::before{width:23px;height:5px}.shape-cross::after{width:5px;height:23px}.shape-cross-a{top:10%;left:24%}.shape-cross-b{right:-8px;top:61%}.shape-cross-c{left:7%;bottom:21%}.shape-ring{left:-54px;bottom:-55px;width:128px;height:128px;border-width:18px;box-shadow:0 0 0 24px rgba(35,57,114,.38)}.shape-blue{right:-58px;bottom:-58px;width:128px;height:128px}.shape-triangle{right:9%;bottom:17%;width:27px;height:25px}.shape-triangle-teal{left:12%;bottom:14%;width:25px;height:24px}.shape-squiggle{width:96px;height:38px;border-width:3px}.shape-squiggle::after{left:28px;top:-3px;width:60px;height:35px;border-width:3px}.shape-squiggle-a{left:-70px;top:20%}.shape-squiggle-b{right:-70px;top:27%}.shape-squiggle-c{right:8%;bottom:4%}.wrap{padding:0 16px 48px}.masthead{min-height:76px;align-items:flex-start;padding:17px 0;flex-direction:column;gap:16px}.brand{gap:10px}.brand-mark{font-size:25px}.brand-kicker{padding-left:10px;font-size:9px}.header-actions{width:100%;justify-content:space-between;gap:12px}.player-field{gap:7px}.player-field input{width:104px}.connection summary{min-height:34px}.intro{padding:34px 0 21px;align-items:flex-start;flex-direction:column;gap:13px}.intro h1{font-size:38px}.intro h1 em{white-space:nowrap}.collection-count{padding:0}.grid{grid-template-columns:1fr;gap:12px}.thumb-wrap{aspect-ratio:1.8}.card-body{min-height:218px;padding:17px}.game-title{font-size:29px}.tagline{font-size:15px}.pbar{padding:8px}.pbar b{font-size:18px}.share{max-width:46vw;font-size:10px}}
@media(max-width:640px){.brand{gap:8px}.brand-monogram{width:32px;height:32px;font-size:8px}.brand-monogram span:nth-child(2){font-size:11px}.brand-mark{font-size:16px}.brand-kicker{padding-left:9px;font-size:8px}.shape-bolt,.shape-squiggle-a,.shape-cross-a,.shape-cross-b{display:none}}
@media(max-width:1000px){.intro h1{font-size:42px}}
@media(max-width:640px){.intro h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="ambience" aria-hidden="true">
  <span class="shape shape-purple"></span><span class="shape shape-teal"></span><span class="shape shape-bolt"></span>
  <span class="shape shape-star"></span><span class="shape shape-dot shape-dot-a"></span><span class="shape shape-dot shape-dot-b"></span><span class="shape shape-dot shape-dot-c"></span>
  <span class="shape shape-cross shape-cross-a"></span><span class="shape shape-cross shape-cross-b"></span><span class="shape shape-cross shape-cross-c"></span>
  <span class="shape shape-ring"></span><span class="shape shape-blue"></span><span class="shape shape-triangle"></span><span class="shape shape-triangle-teal"></span>
  <span class="shape shape-squiggle shape-squiggle-a"></span><span class="shape shape-squiggle shape-squiggle-b"></span><span class="shape shape-squiggle shape-squiggle-c"></span>
</div>
<div class="wrap">
  <header class="masthead">
    <a class="brand" href="/" aria-label="Unlike Hero home">
      <span class="brand-monogram" aria-hidden="true"><span>U</span><span>/</span><span>H</span></span>
      <span class="brand-mark">UNLIKE<span class="slash">/</span>HERO</span>
      <span class="brand-kicker">Independent<br>co-op arcade</span>
    </a>
    <div class="header-actions">
      <label class="player-field" for="player-name"><span>Player</span><input id="player-name" maxlength="24" autocomplete="nickname" placeholder="Your name"></label>
      <details class="connection">
        <summary>Connection</summary>
        <div class="connection-panel">
          <label for="relay-url">Multiplayer relay
            <input id="relay-url" placeholder="ws://host:8080/relay" spellcheck="false">
          </label>
        </div>
      </details>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <span class="eyebrow">The collection</span>
        <h1 id="page-title">Choose your <em>next game.</em></h1>
      </div>
      <div class="collection-count"><strong id="game-count">00</strong><span>games in rotation</span></div>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="section-head">
        <h2 id="library-title">The lineup</h2>
        <span class="section-index">01 / Play</span>
      </div>
      <div class="grid" id="games"></div>
      <details class="add-game">
        <summary>Building for this hub?</summary>
        <p>Run <code>node tools/new-game.mjs my-game "My Game"</code> to add a game. See <code>docs/ARCHITECTURE.md</code> for the integration guide.</p>
      </details>
    </section>

  </main>
</div>

<div class="player" id="player" hidden>
  <div class="pbar">
    <div class="row"><button class="btn" id="p-exit">← Library</button><b id="p-title">Game</b></div>
    <div class="row"><span class="share" id="p-share"></span><button class="btn" id="p-copy">Copy partner link</button><button class="btn" id="p-full">Fullscreen</button></div>
  </div>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
</div>

<script src="shared/sdk/hub-config.js"></script>
<script src="games/registry.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const GAMES = window.GAME_REGISTRY || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// player identity shared with every game through the SDK
function player() { let p = store.get('hub.player', null); if (!p || !p.id) { p = { id: 'p_' + Math.random().toString(36).slice(2, 10), name: 'Player' }; store.set('hub.player', p); } return p; }
const nameIn = $('#player-name'); nameIn.value = player().name;
nameIn.addEventListener('change', () => { const p = player(); p.name = nameIn.value.trim() || 'Player'; store.set('hub.player', p); });
const relayIn = $('#relay-url'); relayIn.value = store.get('hub.relayUrl', '') || (window.HUB_CONFIG && window.HUB_CONFIG.relayUrl) || '';
relayIn.addEventListener('change', () => store.set('hub.relayUrl', relayIn.value.trim()));

function entryUrl(game, entry) {
  const [file, hash] = (entry || game.entry).split('#');
  return `${game.path}${file}?hub=1${hash ? '#' + hash : ''}`;
}
function renderGames() {
  $('#game-count').textContent = String(GAMES.length).padStart(2, '0');
  $('#games').innerHTML = GAMES.map(g => {
    const roles = g.roles && g.roles.length ? g.roles : [{ id: 'play', name: 'Play', entry: g.entry }];
    const firstRole = roles[0];
    const titleMarkup = g.id === 'party-pack'
      ? '<span class="party-word party-word-a">PARTY</span><span class="party-word party-word-b">PACK</span>'
      : g.id === 'short-fuse'
      ? '<span class="fuse-short">SHORT</span><span class="fuse-fuse">FUSE</span>'
      : esc(g.title);
    const players = g.players ? `${g.players.min}${g.players.max !== g.players.min ? '–' + g.players.max : ''} players` : 'Players';
    const roleControl = roles.length > 1 ? `
      <div class="role-select-wrap">
        <label for="role-${esc(g.id)}">Play as</label>
        <select class="role-select" id="role-${esc(g.id)}" data-role-select title="${esc(firstRole.description || '')}" aria-label="Choose a role for ${esc(g.title)}">
          ${roles.map(r => `<option value="${esc(r.id)}" data-description="${esc(r.description || '')}">${esc(r.name)}</option>`).join('')}
        </select>
      </div>` : `<span class="single-role">${esc(firstRole.name || 'Play')}</span>`;
    return `
      <article class="card">
        <div class="thumb-wrap">
          <img class="thumb" src="${esc(g.path + (g.thumbnail || ''))}" alt="" loading="lazy" decoding="async">
          ${g.status && g.status !== 'playable' ? `<span class="status">${esc(g.status)}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-meta"><span class="players">${esc(players)}</span></div>
          <h2 class="game-title game-title-${esc(g.id)}"${g.id === 'party-pack' || g.id === 'short-fuse' ? ` aria-label="${esc(g.title)}"` : ''}>${titleMarkup}</h2>
          <p class="tagline">${esc(g.tagline || '')}</p>
          <div class="tags">${(g.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div class="card-action">${roleControl}<button class="btn primary" data-game="${esc(g.id)}" data-title="${esc(g.title)}" data-role="${esc(firstRole.id)}" aria-label="Play ${esc(g.title)} as ${esc(firstRole.name)}">Play <span aria-hidden="true">→</span></button></div>
        </div>
      </article>`;
  }).join('');
  document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => openGame(b.dataset.game, b.dataset.role));
  document.querySelectorAll('[data-role-select]').forEach(select => select.addEventListener('change', () => {
    const option = select.selectedOptions[0];
    const cardAction = select.closest('.card-action');
    const button = cardAction.querySelector('[data-game]');
    button.dataset.role = select.value;
    button.setAttribute('aria-label', `Play ${button.dataset.title} as ${option.textContent}`);
    select.title = option.dataset.description || '';
  }));
}

let current = null;
function openGame(id, roleId) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  const role = (g.roles || []).find(r => r.id === roleId) || { entry: g.entry, name: 'Play' };
  current = { g, role };
  $('#p-title').textContent = `${g.title} · ${role.name}`;
  $('#frame').src = entryUrl(g, role.entry);
  const other = (g.roles || []).find(r => r.id !== roleId);
  if (other) { const url = new URL(g.path + other.entry, location.href).href; $('#p-share').textContent = `${other.name}: ${url}`; $('#p-copy').hidden = false; $('#p-copy').dataset.url = url; }
  else { $('#p-share').textContent = ''; $('#p-copy').hidden = true; }
  $('#player').hidden = false; document.body.style.overflow = 'hidden';
  setTimeout(() => $('#frame').focus(), 300);
}
function closeGame() { $('#player').hidden = true; $('#frame').src = 'about:blank'; document.body.style.overflow = ''; current = null; }
$('#p-exit').onclick = closeGame;
$('#p-full').onclick = () => { const el = $('#player'); (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => toast('Fullscreen is not available here')); };
$('#p-copy').onclick = () => { const u = $('#p-copy').dataset.url; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Partner link copied'), () => toast(u)); };

// messages from games (Hub SDK protocol)
window.addEventListener('message', e => {
  const m = e.data; if (!m || m.source !== 'hub-game') return;
  if (m.type === 'exit') closeGame();
});
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#player').hidden && document.activeElement !== $('#frame')) closeGame(); });

renderGames();
if (!GAMES.length) $('#games').insertAdjacentHTML('afterbegin', '<p class="empty">No games registered. Run <code>node tools/build-registry.mjs</code>.</p>');
</script>
</body>
</html>
