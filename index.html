<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unlike Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a dark arcade shelf. Header, a grid of game cards built from games/registry.js, recent sessions; games open in a full-window player. */
:root{
  --bg:#07090a; --panel:#111518; --panel-2:#171c20; --line:#262e33; --ink:#e3e8e1; --muted:#8a958e; --dim:#59635d;
  --accent:#ff5a36; --amber:#ffb020; --ok:#38f27a;
  --f-display:'Saira Stencil One','Impact',sans-serif; --f-ui:'Chakra Petch',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 70% 50% at 50% -10%,#1b242a 0,transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.brand h1{margin:0;font:400 clamp(42px,7vw,72px)/.9 var(--f-display);letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:4px;font:600 10px var(--f-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.field input{background:#0c1012;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:14px var(--f-mono);letter-spacing:normal;text-transform:none;color:var(--ink);min-width:180px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:linear-gradient(#20272b,#161b1e);padding:9px 14px;border-radius:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#566169}
.btn.primary{background:linear-gradient(#ff6a3d,#c9331b);border-color:#ff7b52;color:#170806}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#4b565d}
.thumb{aspect-ratio:16/10;background:#0b0e10 center/cover no-repeat;position:relative}
.thumb .status{position:absolute;top:12px;left:12px;font:600 10px var(--f-mono);letter-spacing:.14em;padding:4px 8px;border-radius:999px;background:rgba(5,6,7,.75);border:1px solid rgba(56,242,122,.4);color:var(--ok);text-transform:uppercase}
.body{padding:16px 18px 18px;display:grid;gap:12px;align-content:start}
.body h2{margin:0;font:400 30px/1 var(--f-display)}
.body p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--f-mono);letter-spacing:.06em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:#0d1113}
.roles{display:grid;gap:8px}
.role{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.role b{display:block;font-size:14px}
.role small{color:var(--muted);font-size:12.5px}
.card.add{border-style:dashed;background:transparent;grid-template-rows:auto;align-self:start}
.card.add .body{padding:26px}
code{font:13px var(--f-mono);background:#0d1113;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.sessions{display:grid;gap:8px}
.sessions li{list-style:none;display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-size:14px}
.sessions ul{margin:0;padding:0;display:grid;gap:8px}
.res{font:600 11px var(--f-mono);letter-spacing:.12em;padding:3px 8px;border-radius:999px;border:1px solid}
.res.win{color:var(--ok);border-color:rgba(56,242,122,.4)} .res.lose{color:var(--accent);border-color:rgba(255,90,54,.45)} .res.quit{color:var(--muted);border-color:var(--line)}
.sessions time{margin-left:auto;color:var(--dim);font:12px var(--f-mono)}
.empty{color:var(--dim);font-size:14px}
/* full-window player */
.player{position:fixed;inset:0;z-index:20;background:#000;display:grid;grid-template-rows:auto 1fr}
.pbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:#0b0e10;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pbar b{font:400 22px/1 var(--f-display)}
.pbar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.share{font:12px var(--f-mono);color:var(--muted);max-width:min(520px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{width:100%;height:100%;border:0;background:#050607}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#111518;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:600 12.5px var(--f-mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow">Co-op game hub</span>
      <h1>UNLIKE<span>/</span>HERO</h1>
      <p>Games for two or more people who have to talk to win. Pick a game, choose your role, and send the other role to your partner.</p>
    </div>
    <div class="me">
      <label class="field" for="player-name">Your name<input id="player-name" maxlength="24" autocomplete="nickname"></label>
      <label class="field" for="relay-url">Multiplayer relay (optional)<input id="relay-url" placeholder="ws://host:8080/relay"></label>
    </div>
  </header>

  <section>
    <span class="eyebrow">Library</span>
    <div class="grid" id="games" style="margin-top:12px"></div>
  </section>

  <section class="sessions">
    <span class="eyebrow">Recent sessions on this device</span>
    <div id="sessions"></div>
  </section>
</div>

<div class="player" id="player" hidden>
  <div class="pbar">
    <div class="row"><button class="btn" id="p-exit">← Library</button><b id="p-title">Game</b></div>
    <div class="row"><span class="share" id="p-share"></span><button class="btn" id="p-copy">Copy partner link</button><button class="btn" id="p-full">Fullscreen</button></div>
  </div>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
</div>

<script src="shared/sdk/hub-config.js"></script>
<script src="games/registry.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const GAMES = window.GAME_REGISTRY || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// player identity shared with every game through the SDK
function player() { let p = store.get('hub.player', null); if (!p || !p.id) { p = { id: 'p_' + Math.random().toString(36).slice(2, 10), name: 'Player' }; store.set('hub.player', p); } return p; }
const nameIn = $('#player-name'); nameIn.value = player().name;
nameIn.addEventListener('change', () => { const p = player(); p.name = nameIn.value.trim() || 'Player'; store.set('hub.player', p); });
const relayIn = $('#relay-url'); relayIn.value = store.get('hub.relayUrl', '') || (window.HUB_CONFIG && window.HUB_CONFIG.relayUrl) || '';
relayIn.addEventListener('change', () => store.set('hub.relayUrl', relayIn.value.trim()));

function entryUrl(game, entry) {
  const [file, hash] = (entry || game.entry).split('#');
  return `${game.path}${file}?hub=1${hash ? '#' + hash : ''}`;
}
function renderGames() {
  $('#games').innerHTML = GAMES.map(g => `
    <article class="card" style="--accent:${esc(g.accent || '#ff5a36')}">
      <div class="thumb" style="background-image:url('${esc(g.path + (g.thumbnail || ''))}')">${g.status ? `<span class="status">${esc(g.status)}</span>` : ''}</div>
      <div class="body">
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.tagline || '')}</p>
        <div class="meta"><span class="chip">${g.players ? `${g.players.min}${g.players.max !== g.players.min ? '–' + g.players.max : ''} players` : 'players'}</span>${(g.tags || []).slice(0, 4).map(t => `<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">v${esc(g.version)}</span></div>
        <div class="roles">${(g.roles && g.roles.length ? g.roles : [{ id: 'play', name: 'Play', entry: g.entry }]).map(r => `
          <div class="role"><div><b>${esc(r.name)}</b><small>${esc(r.description || '')}</small></div><button class="btn${r === (g.roles || [])[0] ? ' primary' : ''}" data-game="${esc(g.id)}" data-role="${esc(r.id)}">Play</button></div>`).join('')}</div>
      </div>
    </article>`).join('') + `
    <article class="card add"><div class="body"><h2 style="font-size:24px">Add a game</h2><p>Run <code>node tools/new-game.mjs my-game "My Game"</code> to copy the co-op starter into <code>games/</code>. It appears here automatically. See <code>docs/ARCHITECTURE.md</code>.</p></div></article>`;
  document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => openGame(b.dataset.game, b.dataset.role));
}

let current = null;
function openGame(id, roleId) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  const role = (g.roles || []).find(r => r.id === roleId) || { entry: g.entry, name: 'Play' };
  current = { g, role };
  $('#p-title').textContent = `${g.title} · ${role.name}`;
  $('#frame').src = entryUrl(g, role.entry);
  const other = (g.roles || []).find(r => r.id !== roleId);
  if (other) { const url = new URL(g.path + other.entry, location.href).href; $('#p-share').textContent = `${other.name}: ${url}`; $('#p-copy').hidden = false; $('#p-copy').dataset.url = url; }
  else { $('#p-share').textContent = ''; $('#p-copy').hidden = true; }
  $('#player').hidden = false; document.body.style.overflow = 'hidden';
  setTimeout(() => $('#frame').focus(), 300);
}
function closeGame() { $('#player').hidden = true; $('#frame').src = 'about:blank'; document.body.style.overflow = ''; current = null; renderSessions(); }
$('#p-exit').onclick = closeGame;
$('#p-full').onclick = () => { const el = $('#player'); (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => toast('Fullscreen is not available here')); };
$('#p-copy').onclick = () => { const u = $('#p-copy').dataset.url; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Partner link copied'), () => toast(u)); };

// messages from games (Hub SDK protocol)
window.addEventListener('message', e => {
  const m = e.data; if (!m || m.source !== 'hub-game') return;
  if (m.type === 'exit') closeGame();
  if (m.type === 'event' && m.event === 'session-end') renderSessions();
});

function renderSessions() {
  const log = store.get('hub.sessions', []);
  if (!log.length) { $('#sessions').innerHTML = '<p class="empty">No sessions yet. Finished rounds from any game show up here.</p>'; return; }
  $('#sessions').innerHTML = '<ul>' + log.slice(0, 8).map(s => {
    const g = GAMES.find(x => x.id === s.gameId), r = (s.data && s.data.result) || 'quit';
    const detail = [s.data && s.data.level, s.data && s.data.timeLeft && `${s.data.timeLeft} left`, s.data && s.data.strikes != null && `${s.data.strikes} strikes`].filter(Boolean).join(' · ');
    return `<li><span class="res ${esc(r)}">${esc(r)}</span><b>${esc((g && g.title) || s.title || s.gameId)}</b><span style="color:var(--muted)">${esc(detail)}</span><time>${new Date(s.at).toLocaleString()}</time></li>`;
  }).join('') + '</ul>';
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#player').hidden && document.activeElement !== $('#frame')) closeGame(); });

renderGames(); renderSessions();
if (!GAMES.length) $('#games').insertAdjacentHTML('afterbegin', '<p class="empty">No games registered. Run <code>node tools/build-registry.mjs</code>.</p>');
</script>
</body>
</html>
