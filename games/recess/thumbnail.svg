<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f55"/>
      <stop offset="1" stop-color="#a96d38"/>
    </linearGradient>
    <pattern id="grain" width="40" height="400" patternUnits="userSpaceOnUse">
      <path d="M6 0c3 120-3 260 2 400M24 0c-4 140 4 250-1 400" stroke="rgba(90,50,10,.12)" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="rule" width="640" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 25.5H640" stroke="#b9d3f0" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="mb1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#80deea"/><stop offset="1" stop-color="#00838f"/></radialGradient>
    <radialGradient id="mb2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffb74d"/><stop offset="1" stop-color="#e65100"/></radialGradient>
    <radialGradient id="mb3" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#b39ddb"/><stop offset="1" stop-color="#4527a0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#wood)"/>
  <rect width="640" height="400" fill="url(#grain)"/>

  <!-- open notebook -->
  <g transform="rotate(-3 320 200)">
    <rect x="70" y="40" width="500" height="320" rx="6" fill="rgba(0,0,0,.22)" transform="translate(6 8)"/>
    <rect x="70" y="40" width="250" height="320" fill="#fffaf0"/>
    <rect x="320" y="40" width="250" height="320" fill="#fffaf0"/>
    <rect x="70" y="40" width="500" height="320" fill="url(#rule)" opacity=".9"/>
    <path d="M112 40v320" stroke="#ec6f72" stroke-width="2.5"/>
    <path d="M320 40v320" stroke="rgba(0,0,0,.18)" stroke-width="4"/>
    <rect x="70" y="40" width="500" height="320" fill="none" stroke="#1d2b4f" stroke-width="3" rx="4"/>

    <!-- logo -->
    <g font-family="Caveat, 'Comic Sans MS', cursive" font-weight="700" font-size="74">
      <text x="128" y="112" fill="#e0453a" transform="rotate(-6 140 100)">R</text>
      <text x="165" y="110" fill="#2463d6">E</text>
      <text x="200" y="114" fill="#ff9a3c" transform="rotate(-3 210 100)">C</text>
      <text x="236" y="110" fill="#2e9e48" transform="rotate(5 245 100)">E</text>
      <text x="269" y="113" fill="#8a5be6">S</text>
      <text x="299" y="110" fill="#ef6aa8" transform="rotate(4 310 100)">S</text>
    </g>
    <path d="M132 126c50-8 120-10 200-2" stroke="#ffe15a" stroke-width="10" stroke-linecap="round" fill="none" opacity=".75"/>

    <!-- tic-tac-toe -->
    <g stroke="#4a4f5c" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M170 160c1 50 0 100 2 150M216 158c-1 52 1 100 0 152M132 200c60-2 100 1 130-1M130 250c62 1 104-1 132 1"/>
    </g>
    <g stroke="#e0453a" stroke-width="6" stroke-linecap="round"><path d="M140 166l18 22M158 166l-18 22M184 214l20 24M204 214l-20 24M228 262l18 24M246 262l-18 24"/></g>
    <g stroke="#2463d6" stroke-width="6" fill="none"><circle cx="193" cy="178" r="13"/><circle cx="148" cy="275" r="13"/></g>
    <path d="M136 162l118 132" stroke="#ffcf33" stroke-width="14" stroke-linecap="round" opacity=".55"/>

    <!-- raja chit -->
    <g transform="translate(352 64) rotate(8)">
      <path d="M0 4l70-4 3 92-70 3z" fill="#ffd34d" stroke="#1d2b4f" stroke-width="3"/>
      <path d="M14 46l6-22 12 12 8-18 8 18 12-12 6 22z" fill="#fff3b0" stroke="#1d2b4f" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="38" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2b4f">राजा</text>
    </g>
    <!-- dots and boxes -->
    <g transform="translate(450 70)">
      <rect x="0" y="0" width="34" height="34" fill="#2463d6" opacity=".22"/>
      <path d="M0 0h68M0 0v34M34 0v34M0 34h34" stroke="#2463d6" stroke-width="4" stroke-linecap="round"/>
      <path d="M68 0v34M34 34h34" stroke="#e0453a" stroke-width="4" stroke-linecap="round"/>
      <g fill="#1d2b4f"><circle cx="0" cy="0" r="4"/><circle cx="34" cy="0" r="4"/><circle cx="68" cy="0" r="4"/><circle cx="0" cy="34" r="4"/><circle cx="34" cy="34" r="4"/><circle cx="68" cy="34" r="4"/><circle cx="0" cy="68" r="4"/><circle cx="34" cy="68" r="4"/><circle cx="68" cy="68" r="4"/></g>
    </g>
    <!-- die -->
    <g transform="translate(372 200) rotate(-12)">
      <rect width="58" height="58" rx="12" fill="#fff" stroke="#1d2b4f" stroke-width="4"/>
      <g fill="#1d2b4f"><circle cx="16" cy="16" r="5"/><circle cx="42" cy="16" r="5"/><circle cx="29" cy="29" r="5"/><circle cx="16" cy="42" r="5"/><circle cx="42" cy="42" r="5"/></g>
    </g>
    <!-- pen -->
    <g transform="translate(470 300) rotate(-28)">
      <rect x="-70" y="-8" width="128" height="16" rx="8" fill="#2463d6" stroke="#1d2b4f" stroke-width="3"/>
      <path d="M58 -8l20 8-20 8z" fill="#cfd8dc" stroke="#1d2b4f" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-72" y="-9" width="40" height="18" rx="6" fill="#1a3f8f" stroke="#1d2b4f" stroke-width="3"/>
      <rect x="-68" y="-15" width="34" height="5" rx="2" fill="#b0bec5" stroke="#1d2b4f" stroke-width="2"/>
    </g>
    <!-- carrom coin -->
    <g transform="translate(470 220)">
      <circle r="17" fill="#e53935" stroke="#1d2b4f" stroke-width="3"/>
      <circle r="10" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
    </g>
  </g>

  <!-- marbles rolling on the desk -->
  <g stroke="#1d2b4f" stroke-width="3">
    <circle cx="60" cy="340" r="20" fill="url(#mb1)"/>
    <circle cx="590" cy="60" r="18" fill="url(#mb2)"/>
    <circle cx="604" cy="352" r="16" fill="url(#mb3)"/>
  </g>
  <!-- pencil -->
  <g transform="translate(520 386) rotate(-8)">
    <rect x="-90" y="-9" width="130" height="18" fill="#ffc83d" stroke="#1d2b4f" stroke-width="3"/>
    <path d="M40 -9l24 9-24 9z" fill="#f2d2a9" stroke="#1d2b4f" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-104" y="-9" width="15" height="18" fill="#ff8fab" stroke="#1d2b4f" stroke-width="3"/>
  </g>
</svg>
