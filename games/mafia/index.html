<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Mafia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/mafia.css">
</head>
<body class="phase-lobby">
<!-- Atmosphere layers; body.phase-* classes cross-fade them. -->
<div class="scene" aria-hidden="true">
  <div class="sky-lobby"></div><div class="sky-night"></div><div class="sky-dawn"></div><div class="sky-day"></div><div class="sky-trial"></div><div class="sky-end"></div>
  <div class="moon"></div><div class="fog"></div><div class="vignette"></div><div class="grain"></div>
</div>
<canvas id="fx-bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="root"><noscript>Mafia needs JavaScript.</noscript></div>

<!-- Hub SDK (optional: the game also runs standalone) -->
<script src="../../shared/sdk/hub-config.js"></script>
<script src="../../shared/sdk/hub-sdk.js"></script>
<!-- Socket.io client, served by the Mafia game server when the hub server runs. Missing = offline mode only. -->
<script src="socket.io/socket.io.min.js" onerror="this.remove()"></script>
<!-- Vendored so the game works offline and from file:// (React 18.3.1, htm 3.1.1; licenses in vendor/) -->
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.min.js"></script>
<!-- Shared rules engine (same file the server runs) -->
<script src="engine/mafia-engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
