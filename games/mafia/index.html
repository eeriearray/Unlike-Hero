<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Mafia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,800;1,900&family=Oswald:wght@500;600&family=Special+Elite&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="css/mafia.css">
</head>
<body class="phase-lobby">
<!-- The 3D town hall (js/hall3d.js). Without WebGL, the illustrated hall below is shown instead. -->
<div id="hall3d"></div>
<div class="scene" aria-hidden="true"></div>
<script src="js/scene.js"></script>
<canvas id="fx-bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="root"><noscript>Mafia needs JavaScript.</noscript></div>

<!-- Hub SDK (optional: the game also runs standalone) -->
<script src="../../shared/sdk/hub-config.js"></script>
<script src="../../shared/sdk/hub-sdk.js"></script>
<!-- Socket.io client, served by the Mafia game server when the hub server runs. Missing = offline mode only. -->
<script src="socket.io/socket.io.min.js" onerror="this.remove()"></script>
<!-- Vendored so the game works offline and from file:// (React 18.3.1, htm 3.1.1, three.js r147; licenses in vendor/) -->
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.min.js"></script>
<script src="vendor/three.min.js"></script>
<!-- Shared rules engine (same file the server runs) -->
<script src="engine/mafia-engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/voice.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/hall3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
