<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <!-- Sky gradient: clean, deep oceanic twilight -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1826"/>
      <stop offset="60%" stop-color="#143448"/>
      <stop offset="100%" stop-color="#1d5064"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbe3b" stop-opacity=".3"/>
      <stop offset="60%" stop-color="#ff9900" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>

    <!-- Sail gradient -->
    <linearGradient id="sailWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eddcc6"/>
    </linearGradient>
    <linearGradient id="sailRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#c92231"/>
    </linearGradient>
  </defs>

  <!-- 1. Sky -->
  <rect width="1200" height="720" fill="url(#sky)"/>

  <!-- 2. Golden Sun -->
  <circle cx="780" cy="230" r="150" fill="url(#sunGlow)"/>
  <circle cx="780" cy="230" r="85" fill="#fecb4e"/>
  <circle cx="780" cy="230" r="74" fill="#ffe27c"/>

  <!-- 3. Distant Ocean Wave -->
  <path d="M 0 435 Q 320 395 660 435 Q 960 475 1200 420 L 1200 720 L 0 720 Z" fill="#0c3848"/>

  <!-- 4. PIRATE SHIP (CLEAN & ICONIC) -->
  <g id="ship">
    <!-- Bowsprit spar -->
    <line x1="380" y1="438" x2="270" y2="408" stroke="#25160d" stroke-width="8" stroke-linecap="round"/>

    <!-- Mast -->
    <line x1="530" y1="440" x2="530" y2="135" stroke="#25160d" stroke-width="12" stroke-linecap="round"/>

    <!-- Yardarm -->
    <line x1="415" y1="210" x2="645" y2="210" stroke="#25160d" stroke-width="7" stroke-linecap="round"/>

    <!-- Main Sail (Ivory cloth) -->
    <path d="M 425 210
             Q 530 220 635 210
             Q 625 315 605 385
             Q 530 405 455 385
             Q 435 315 425 210 Z"
          fill="url(#sailWhite)" stroke="#1a0f08" stroke-width="5" stroke-linejoin="round"/>

    <!-- Pirate Skull & Crossbones Emblem on Main Sail -->
    <g transform="translate(530, 300)">
      <!-- Crossed Bones -->
      <line x1="-42" y1="-38" x2="42" y2="38" stroke="#17191d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-44" cy="-40" r="5" fill="#17191d"/><circle cx="-38" cy="-44" r="5" fill="#17191d"/>
      <circle cx="44" cy="40" r="5" fill="#17191d"/><circle cx="38" cy="44" r="5" fill="#17191d"/>
      <line x1="42" y1="-38" x2="-42" y2="38" stroke="#17191d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="44" cy="-40" r="5" fill="#17191d"/><circle cx="38" cy="-44" r="5" fill="#17191d"/>
      <circle cx="-44" cy="40" r="5" fill="#17191d"/><circle cx="-38" cy="44" r="5" fill="#17191d"/>

      <!-- Skull -->
      <ellipse cx="0" cy="-5" rx="24" ry="22" fill="#17191d"/>
      <path d="M -12 11 H 12 V 22 H -12 Z" fill="#17191d"/>
      <!-- Eyes & Nose -->
      <circle cx="-9" cy="-3" r="5.5" fill="#fdfaf3"/>
      <circle cx="9" cy="-3" r="5.5" fill="#fdfaf3"/>
      <polygon points="0,5 -3,11 3,11" fill="#fdfaf3"/>
    </g>

    <!-- Front Jib Sail (Crimson Red) -->
    <path d="M 285 415
             Q 380 425 435 440
             Q 420 330 525 210
             Q 395 305 285 415 Z"
          fill="url(#sailRed)" stroke="#1a0f08" stroke-width="5" stroke-linejoin="round"/>

    <!-- Pirate Flag at Masthead -->
    <path d="M 534 135 L 600 148 L 582 161 L 600 174 L 534 167 Z" fill="#17191d"/>
    <circle cx="560" cy="154" r="3.5" fill="#fdfaf3"/>

    <!-- Ship Hull -->
    <path d="M 335 445
             C 365 510 435 540 535 540
             C 630 540 695 515 735 435
             C 740 405 685 410 655 418
             C 545 432 445 438 335 445 Z"
          fill="#351f14" stroke="#170c07" stroke-width="6" stroke-linejoin="round"/>

    <!-- Golden Deck Trim Line -->
    <path d="M 350 442 C 450 435 550 430 655 418 C 690 414 725 414 732 425" fill="none" stroke="#e5a93c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 5. Foreground Ocean Waves -->
  <!-- Main Foreground Wave -->
  <path d="M 0 505
           C 280 455 580 505 840 475
           C 1020 450 1140 485 1200 470
           L 1200 720 L 0 720 Z"
        fill="#072735"/>

  <!-- Wave Foam Crest -->
  <path d="M 0 505
           C 280 455 580 505 840 475
           C 1020 450 1140 485 1200 470"
        fill="none" stroke="#36d6be" stroke-width="6" stroke-linecap="round"/>

  <!-- Front Base Wave -->
  <path d="M 0 615
           C 360 565 740 620 1020 585
           C 1120 575 1170 590 1200 585
           L 1200 720 L 0 720 Z"
        fill="#03151e"/>

  <path d="M 0 615
           C 360 565 740 620 1020 585
           C 1120 575 1170 590 1200 585"
        fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity=".4"/>
</svg>
