<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#2a1530"/>
      <stop offset=".55" stop-color="#0f0c18"/>
      <stop offset="1" stop-color="#08070d"/>
    </radialGradient>
    <radialGradient id="felt" cx="50%" cy="100%" r="80%">
      <stop offset="0" stop-color="#1d7a4a"/>
      <stop offset="1" stop-color="#0c2a1c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="560" rx="470" ry="260" fill="url(#felt)" stroke="#f5c451" stroke-opacity=".35" stroke-width="4"/>
  <!-- cards -->
  <g transform="translate(300 215) rotate(-12)">
    <rect width="120" height="168" rx="12" fill="#f8f5ee" stroke="#d9d2c2"/>
    <text x="16" y="38" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14121c">A</text>
    <text x="60" y="110" font-family="Georgia, serif" font-size="56" text-anchor="middle" fill="#14121c">♠</text>
  </g>
  <g transform="translate(390 200) rotate(9)">
    <rect width="120" height="168" rx="12" fill="#f8f5ee" stroke="#d9d2c2"/>
    <text x="16" y="38" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#d8283f">K</text>
    <text x="60" y="110" font-family="Georgia, serif" font-size="56" text-anchor="middle" fill="#d8283f">♥</text>
  </g>
  <!-- chips -->
  <g>
    <circle cx="210" cy="395" r="44" fill="#ff4d5e"/><circle cx="210" cy="395" r="30" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="10 9"/>
    <circle cx="590" cy="400" r="44" fill="#4d8dff"/><circle cx="590" cy="400" r="30" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="10 9"/>
    <circle cx="650" cy="350" r="36" fill="#f5c451"/><circle cx="650" cy="350" r="24" fill="none" stroke="#241a02" stroke-width="5" stroke-dasharray="8 8"/>
  </g>
  <!-- title -->
  <text x="400" y="118" text-anchor="middle" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="92" font-weight="800" fill="#f5c451" filter="url(#glow)" opacity=".5">NEON CASINO</text>
  <text x="400" y="118" text-anchor="middle" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="92" font-weight="800" fill="#ffe6a6">NEON CASINO</text>
  <text x="400" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#d4cee6">ONE WALLET · EVERY TABLE</text>
</svg>
